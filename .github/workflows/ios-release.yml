name: iOS Release (TestFlight)

# main'e push (ya da elle "Run workflow") → analiz + test → .ipa → TestFlight.
# İmza: sertifika/profil dosyası GEREKMEZ. App Store Connect API anahtarı (Admin) ile Apple'ın bulutta yönetilen
# otomatik imzası kullanılır; dağıtım sertifikası ve profil ilk koşuda Apple tarafından otomatik oluşturulur.
# Gerekli GitHub Secrets eksikse imza/yükleme adımları atlanır (uyarı verir). Kurulum: docs/YAYIN.md

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'tools/**'
      - 'store/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
      LEADERBOARD_SECRET: ${{ secrets.LEADERBOARD_SECRET }}
      BUNDLE_ID: com.bigsoft.meshurnohutcu
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Apple bilgileri tam mı?
        id: sig
        run: |
          missing=""
          for v in APP_STORE_CONNECT_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=iOS imzası atlandı::Eksik secret(ler):$missing — docs/YAYIN.md bölüm 2'ye bak. Analiz ve test geçti; paket üretilmedi."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: App Store Connect API anahtarını yaz
        if: steps.sig.outputs.ready == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Otomatik imza ayarı
        if: steps.sig.outputs.ready == 'true'
        run: |
          {
            echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
            echo "CODE_SIGN_STYLE = Automatic"
          } >> ios/Flutter/Release.xcconfig

      - name: Flutter iOS derlemesi (imzasız)
        if: steps.sig.outputs.ready == 'true'
        run: |
          DEFINES=""
          if [ -n "$LEADERBOARD_URL" ]; then DEFINES="--dart-define=LEADERBOARD_URL=$LEADERBOARD_URL --dart-define=LEADERBOARD_SECRET=$LEADERBOARD_SECRET"; fi
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} $DEFINES

      - name: Arşivle (imza Apple'dan otomatik)
        if: steps.sig.outputs.ready == 'true'
        run: |
          KEY=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive

      - name: IPA dışa aktar
        if: steps.sig.outputs.ready == 'true'
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          KEY=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ls -la build/ios/ipa

      - uses: actions/upload-artifact@v4
        if: steps.sig.outputs.ready == 'true'
        with:
          name: meshur-nohutcu-ipa
          path: build/ios/ipa/*.ipa

      - name: TestFlight'a yükle
        if: steps.sig.outputs.ready == 'true'
        run: |
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: API anahtarını sil
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
