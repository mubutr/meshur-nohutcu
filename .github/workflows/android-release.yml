name: Android Release (Google Play)

# main'e push (ya da elle "Run workflow") → analiz + test → imzalı .aab → Google Play'in "Dahili test" kanalı.
# Gerekli GitHub Secrets eksikse imza/yükleme adımları atlanır (uyarı verir); analiz ve test yine çalışır.
# Kurulum: docs/YAYIN.md

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'tools/**'
      - 'store/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play kanalı (internal | alpha | beta | production)'
        default: internal
        required: true

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
      LEADERBOARD_SECRET: ${{ secrets.LEADERBOARD_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: İmza bilgileri tam mı?
        id: sig
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android imzası atlandı::Eksik secret(ler):$missing — docs/YAYIN.md bölüm 3'e bak. Analiz ve test geçti; paket üretilmedi."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keystore ve key.properties
        if: steps.sig.outputs.ready == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: AAB derle (imzalı)
        if: steps.sig.outputs.ready == 'true'
        run: |
          DEFINES=""
          if [ -n "$LEADERBOARD_URL" ]; then DEFINES="--dart-define=LEADERBOARD_URL=$LEADERBOARD_URL --dart-define=LEADERBOARD_SECRET=$LEADERBOARD_SECRET"; fi
          # versionCode her yüklemede artmalı: run_number + 100 (daha önce denenmiş düşük kodlarla çakışmasın)
          flutter build appbundle --release --build-number=$(( GITHUB_RUN_NUMBER + 100 )) $DEFINES

      - name: İmzayı doğrula (debug imzalı paket Play'e yüklenemez)
        if: steps.sig.outputs.ready == 'true'
        run: |
          out=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$out" | head -8
          if echo "$out" | grep -qi "Android Debug"; then
            echo "::error::AAB debug anahtarıyla imzalanmış"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.sig.outputs.ready == 'true'
        with:
          name: meshur-nohutcu-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Google Play'e yükle
        if: steps.sig.outputs.ready == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bigsoft.meshurnohutcu
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Play yüklemesi atlandı bildirimi
        if: steps.sig.outputs.ready == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::warning title=Play'e yüklenmedi::PLAY_SERVICE_ACCOUNT_JSON secret'ı yok; AAB yalnızca artifact olarak saklandı."
